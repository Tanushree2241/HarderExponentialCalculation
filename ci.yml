name: CI

on:
  push:
    branches: [main, broken]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the image locally (no push)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: expo:1.0

      # Smoke test: 2^10 should print 1024
      - name: Run container
        run: |
          out=$(docker run --rm expo:1.0 2 10)
          echo "$out"
          test "$out" = "2 ^ 10 = 1024"

      # Test the Kubernetes Job on a temporary kind cluster
      - name: Start minikube
        uses: medyagh/setup-minikube@latest

      - name: Load image into minikube
        run: minikube image load expo:1.0

      - name: Run Job
        run: |
          kubectl apply -f Job.yaml
          kubectl wait --for=condition=complete job/expo-job --timeout=60s
          kubectl logs job/expo-job

  publish:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/expo:1.0
            ghcr.io/${{ github.repository_owner }}/expo:latest
